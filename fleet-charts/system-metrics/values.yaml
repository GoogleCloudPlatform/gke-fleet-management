# Required: GCP Fleet Project ID
# projectId: ""

# Required: Fleet Membership Name
# membershipName: ""

# Required: Cloud Monitoring location (GCP region or zone, e.g., "us-central1"; "global" is not allowed for prometheus_target)
# location: ""

# Fleet Membership Location
membershipLocation: "global"

# Cluster Name for Cloud Monitoring Monitored Resource labels (defaults to membershipName if empty)
clusterName: ""

# Kubernetes Namespace for the System Metrics OpenTelemetry Collector
namespace: "kube-system"

# Optional: Google Cloud Service Account email for Fleet Workload Identity impersonation (e.g., for VPC-SC)
serviceAccountEmail: ""

# Authenticate with a projected KSA token and an external_account credential file (explicit STS exchange).
# Keep true for clusters without the GKE metadata server (e.g., attached or on-prem clusters) and for
# VPC-SC environments that rely on service_account_impersonation_url.
# Set to false on GKE clusters with Workload Identity (gke-metadata-server); if serviceAccountEmail is set,
# the ServiceAccount is annotated with iam.gke.io/gcp-service-account instead.
useProjectedKsaToken: true

# Metric collection interval for hostmetrics and kubeletstats receivers
collectionInterval: "60s"

# Google-Built OpenTelemetry Collector container image settings
image:
  repository: "us-docker.pkg.dev/cloud-ops-agents-artifacts/google-cloud-opentelemetry-collector/otelcol-google"
  tag: "0.156.1"

# Collector container resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod tolerations (defaults to running on all nodes, including control-plane and TPU nodes)
tolerations:
  - operator: "Exists"
