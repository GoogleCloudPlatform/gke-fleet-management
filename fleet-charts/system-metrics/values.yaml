# Required: GCP Fleet Project ID
# projectId: ""

# Required: GCP Fleet Project Number
# projectNumber: ""

# Required: Fleet Membership Name
# membershipName: ""

# Fleet Membership Location
location: "global"

# Cluster Name for Cloud Monitoring Monitored Resource labels (defaults to membershipName if empty)
clusterName: ""

# Kubernetes Namespace for the System Metrics OpenTelemetry Collector
namespace: "kube-system"

# Optional: Google Cloud Service Account email for Fleet Workload Identity impersonation (e.g., for VPC-SC)
serviceAccountEmail: ""

# Metric collection interval for hostmetrics and kubeletstats receivers
collectionInterval: "60s"

# Google-Built OpenTelemetry Collector container image settings
image:
  repository: "us-docker.pkg.dev/cloud-ops-agents-artifacts/google-cloud-opentelemetry-collector/otelcol-google"
  tag: "0.156.1"

# Collector container resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod tolerations (defaults to running on all nodes, including control-plane and TPU nodes)
tolerations:
  - operator: "Exists"
