# Required: GCP Fleet Project ID
# projectId: ""

# Required: Fleet Membership Name
# membershipName: ""

# Cloud Logging Monitored Resource location (e.g., "global", "us-central1")
location: "global"

# Fleet Membership Location
membershipLocation: "global"

# Cluster Name for Cloud Logging Monitored Resource labels (defaults to membershipName if empty)
clusterName: ""

# Kubernetes Namespace for the Cloud Logging OpenTelemetry Collector
namespace: "kube-system"

# Optional: Google Cloud Service Account email for Fleet Workload Identity impersonation (e.g., for VPC-SC)
serviceAccountEmail: ""

# Authenticate with a projected KSA token and an external_account credential file (explicit STS exchange).
# Keep true for clusters without the GKE metadata server (e.g., attached or on-prem clusters) and for
# VPC-SC environments that rely on service_account_impersonation_url.
# Set to false on GKE clusters with Workload Identity (gke-metadata-server); if serviceAccountEmail is set,
# the ServiceAccount is annotated with iam.gke.io/gcp-service-account instead.
useProjectedKsaToken: true

# Google-Built OpenTelemetry Collector container image settings
image:
  repository: "us-docker.pkg.dev/cloud-ops-agents-artifacts/google-cloud-opentelemetry-collector/otelcol-google"
  tag: "0.156.1"

# Host system log file paths to collect (mapped to k8s_node Monitored Resource)
systemLogs:
  include:
    - /var/log/syslog
    - /var/log/messages
    - /var/log/kern.log

# Host system logs from journald (kubelet, container runtime, kernel), read by a Fluent Bit sidecar because
# the collector image doesn't include journalctl. Mapped to the k8s_node Monitored Resource, with one log
# per unit (for example "kubelet", "containerd", "kernel"). The sidecar needs the host's /etc/machine-id,
# so set enabled: false on nodes without systemd, or the collector pod won't start. On nodes running rsyslog
# (common on Debian and Ubuntu server installs), which copies the journal into the systemLogs files, these
# entries are exported twice; remove those files from systemLogs.include or disable journald.
journald:
  enabled: true
  # Other distributions use other unit names, for example crio.service, k3s.service, or rke2-server.service.
  units:
    - kubelet.service
    - containerd.service
    - docker.service
  kernel: true
  image:
    # Fluent Bit's own registry (the same image as Docker Hub's fluent/fluent-bit, without Docker Hub pull limits)
    repository: "cr.fluentbit.io/fluent/fluent-bit"
    tag: "5.1.3"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Collector container resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Kubernetes events, exported to the "events" log by a single-replica Deployment
events:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Scheduling for the events Deployment. Unlike the DaemonSet, it doesn't tolerate all taints by default,
  # so it isn't placed on dedicated (for example, TPU) or control-plane nodes. Set tolerations if every
  # node in the cluster is tainted.
  nodeSelector: {}
  tolerations: []

# Pod tolerations (defaults to running on all nodes, including control-plane and TPU nodes)
tolerations:
  - operator: "Exists"
